<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quản lý nhân lực</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#f3f5f7; --surface:#ffffff; --surface2:#f8fafb; --ink:#17212b; --muted:#5d6b78; --line:#e1e6eb; --line2:#cfd7de;
  --pri:#0d6670; --pri2:#0a525a; --pri-soft:#e3f1f2; --on-pri:#ffffff;
  --warn:#a35d00; --warn-soft:#fdf1df; --bad:#b42318; --bad-soft:#fdecea; --ok:#1d7a3e; --ok-soft:#e5f4ea;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11171c; --surface:#182027; --surface2:#1d262e; --ink:#e6ecf0; --muted:#9aa8b4; --line:#2a353f; --line2:#36434e;
    --pri:#3fb3bd; --pri2:#5cc3cc; --pri-soft:#173a3e; --on-pri:#062226;
    --warn:#f0a840; --warn-soft:#3a2b14; --bad:#f07468; --bad-soft:#3c1d1a; --ok:#5ccf86; --ok-soft:#173a25;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#11171c; --surface:#182027; --surface2:#1d262e; --ink:#e6ecf0; --muted:#9aa8b4; --line:#2a353f; --line2:#36434e;
  --pri:#3fb3bd; --pri2:#5cc3cc; --pri-soft:#173a3e; --on-pri:#062226;
  --warn:#f0a840; --warn-soft:#3a2b14; --bad:#f07468; --bad-soft:#3c1d1a; --ok:#5ccf86; --ok-soft:#173a25;
  --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 "Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--pri)}
.boot{padding:40px;text-align:center;color:var(--muted)}
/* layout */
.shell{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
.side{background:var(--surface);border-right:1px solid var(--line);padding:16px 12px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;gap:4px}
.brand{padding:4px 8px 14px;border-bottom:1px solid var(--line);margin-bottom:8px}
.brand b{display:block;font-size:15px;color:var(--pri)}
.brand small{color:var(--muted);font-size:12px}
.nav{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;cursor:pointer;color:var(--ink);border:0;background:none;text-align:left;width:100%}
.nav:hover{background:var(--surface2)}
.nav.on{background:var(--pri-soft);color:var(--pri);font-weight:600}
.nav svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.side .spacer{flex:1}
.who{border-top:1px solid var(--line);padding:10px 8px 0;font-size:13px}
.who b{display:block}
.who small{color:var(--muted)}
.main{min-width:0;padding:20px 24px 60px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.top h1{font-size:20px;margin:0;flex:1;min-width:200px}
.demo-bar{background:var(--warn-soft);color:var(--warn);padding:6px 12px;border-radius:8px;font-size:13px;margin-bottom:12px}
/* atoms */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);background:var(--surface);padding:7px 12px;border-radius:8px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--pri)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:var(--on-pri)}
.btn.pri:hover{background:var(--pri2)}
.btn.bad{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:4px 8px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
.card h3{margin:0 0 12px;font-size:15px}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.kpi{padding:14px 16px}
.kpi .v{font-size:26px;font-weight:700;line-height:1.1}
.kpi .l{color:var(--muted);font-size:12.5px;margin-top:4px}
.two{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.bars .row{display:grid;grid-template-columns:minmax(110px,40%) 1fr 40px;gap:8px;align-items:center;padding:3px 0;font-size:13px}
.bars .row span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bars .track{background:var(--surface2);border-radius:4px;height:14px;overflow:hidden}
.bars .fill{background:var(--pri);height:100%;border-radius:4px}
.bars .n{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.tag{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;background:var(--surface2);border:1px solid var(--line);white-space:nowrap}
.tag.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.tag.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.tag.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.tag.pri{background:var(--pri-soft);color:var(--pri);border-color:transparent}
.muted{color:var(--muted)}
.tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table.t{border-collapse:collapse;width:100%;font-size:13px}
table.t th{background:var(--surface2);text-align:left;font-weight:600;color:var(--muted);font-size:12px;text-transform:none;position:sticky;top:0;z-index:1}
table.t th,table.t td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.t tr.click{cursor:pointer}
table.t tr.click:hover td{background:var(--surface2)}
table.t td.num{text-align:right;font-variant-numeric:tabular-nums}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
input[type=text],input[type=password],input[type=date],input[type=number],input[type=email],select,textarea{border:1px solid var(--line2);background:var(--surface);border-radius:8px;padding:7px 9px;min-width:0;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pri-soft);border-color:var(--pri)}
input:disabled,select:disabled,textarea:disabled{background:var(--surface2);color:var(--muted)}
textarea{min-height:64px;resize:vertical}
.filters input,.filters select{width:auto}
.filters input[type=text]{min-width:220px;flex:1}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted)}
label.f.wide{grid-column:1/-1}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px 14px}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px 18px}
.kv div{min-width:0}
.kv .k{font-size:12px;color:var(--muted)}
.kv .v{white-space:pre-wrap;word-break:break-word}
.kv .wide{grid-column:1/-1}
.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);margin:0 0 14px}
.tab{border:0;background:none;padding:9px 12px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;font-size:13px}
.tab.on{color:var(--pri);border-bottom-color:var(--pri);font-weight:600}
.tab .lock{font-size:11px;opacity:.7}
.phead{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.photo{width:96px;height:128px;border-radius:8px;background:var(--surface2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--muted);font-size:12px;text-align:center;flex:none;position:relative}
.photo img{width:100%;height:100%;object-fit:cover}
.photo.edit{cursor:pointer;outline:2px dashed var(--pri);outline-offset:2px}
.phead .info{flex:1;min-width:220px}
.phead h2{margin:0 0 6px;font-size:20px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.chips .tag{white-space:normal}
.subt{font-size:14px;margin:18px 0 8px;display:flex;align-items:center;gap:8px}
.subt .sp{flex:1}
table.et{border-collapse:collapse;width:100%;font-size:13px}
table.et th{font-size:12px;color:var(--muted);text-align:left;font-weight:600;padding:4px;background:var(--surface2)}
table.et td{padding:3px;border-bottom:1px solid var(--line);vertical-align:top}
table.et input,table.et select,table.et textarea{padding:5px 6px;font-size:13px}
table.et textarea{min-height:34px}
.x{border:0;background:none;color:var(--bad);cursor:pointer;font-size:16px;padding:4px 8px}
.files{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.fchip{display:inline-flex;align-items:center;gap:2px;max-width:220px;border:1px solid var(--line2);background:var(--surface2);border-radius:6px;padding:1px 2px 1px 7px;font-size:12px}
.fchip a{cursor:pointer;color:var(--pri);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-decoration:none}
.fchip a:hover{text-decoration:underline}
.fchip .x{font-size:14px;padding:0 4px}
.fchip.ro{padding-right:7px}
.btn.up{padding:3px 8px;font-size:12px;color:var(--pri)}
.btn.up svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
td.fcell{min-width:170px}
.empty{padding:24px;text-align:center;color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.sticky-save{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px 0;margin-top:14px;display:flex;gap:8px;justify-content:flex-end;z-index:2}
/* login */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.login .card{width:100%;max-width:400px;padding:28px}
.login h1{font-size:20px;margin:0 0 4px;color:var(--pri)}
.login p{margin:0 0 18px;color:var(--muted)}
.login form{display:grid;gap:12px}
.quick{display:grid;gap:6px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
/* modal */
.modal{position:fixed;inset:0;background:rgba(10,20,30,.45);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:50;overflow:auto}
.modal.hidden{display:none}
.modal .box{background:var(--surface);border-radius:12px;width:100%;max-width:640px;padding:20px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.modal .box.lg{max-width:900px}
.modal h3{margin:0 0 14px;font-size:17px}
.modal .foot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
#toast div{background:#17212b;color:#fff;padding:9px 14px;border-radius:8px;font-size:13px;box-shadow:0 4px 16px rgba(0,0,0,.25);max-width:90vw}
#toast div.err{background:var(--bad);color:#fff}
.drop{border:2px dashed var(--line2);border-radius:var(--r);padding:26px;text-align:center;background:var(--surface2);cursor:pointer}
.drop:hover{border-color:var(--pri)}
.note{background:var(--pri-soft);border-radius:8px;padding:10px 12px;font-size:13px;margin-bottom:12px}
.note ol{margin:6px 0 0;padding-left:20px}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink)}
.chk input{width:auto}
.prog{height:8px;background:var(--surface2);border-radius:4px;overflow:hidden;margin:8px 0}
.prog div{height:100%;background:var(--pri);width:0}
@media (max-width:820px){
  .shell{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:row;overflow-x:auto;padding:8px;border-right:0;border-bottom:1px solid var(--line);gap:2px}
  .brand,.side .spacer{display:none}
  .who{display:none}
  .nav{width:auto;white-space:nowrap;padding:8px 10px}
  .main{padding:14px 16px 60px}
  .two{grid-template-columns:1fr}
}
@media print{.side,.top .actions,.sticky-save{display:none}.shell{display:block}}
</style>
</head>

const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const noAccent = s => String(s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/đ/g, "d").replace(/Đ/g, "D");
const norm = s => noAccent(s).toLowerCase().replace(/\s+/g, " ").trim();

const isoOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;

const parseISO = s => { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s || ""); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null; };
const fmtDate = s => { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s || ""); return m ? `${m[3]}/${m[2]}/${m[1]}` : (s || ""); };
const fmtD = d => d ? `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()}` : "";
const fmtDT = s => { if (!s) return ""; const d = new Date(s); return isNaN(d) ? s : `${fmtD(d)} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const addMonths = (d, n) => { const x = new Date(d.getFullYear(), d.getMonth() + n, 1); x.setDate(Math.min(d.getDate(), new Date(x.getFullYear(), x.getMonth() + 1, 0).getDate())); return x; };
const daysTo = d => Math.round((d - new Date(new Date().toDateString())) / 864e5);
function toISO(v) {
  if (v == null || v === "") return "";
  if (v instanceof Date) return isNaN(v) ? "" : isoOf(new Date(v.getTime() + 432e5));
  if (typeof v === "number") { if (v > 20000 && v < 80000) { const d = new Date(Math.round((v - 25569) * 864e5)); return `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())}`; } return ""; }
  const s = String(v).trim().replace(/[;,.]+$/, "");
  let m;
  if ((m = /^(\d{4})-(\d{1,2})-(\d{1,2})/.exec(s))) return `${m[1]}-${pad(m[2])}-${pad(m[3])}`;
  if ((m = /(\d{1,2})\s*tháng\s*(\d{1,2})\s*năm\s*(\d{4})/i.exec(s))) return `${m[3]}-${pad(m[2])}-${pad(m[1])}`;

}
const titleCase = s => String(s || "").trim().toLocaleLowerCase("vi").replace(/(^|\s)(\S)/g, (a, b, c) => b + c.toLocaleUpperCase("vi"));
const getP = (o, p) => p.split(".").reduce((a, k) => (a == null ? a : a[k]), o);

const sleep = ms => new Promise(r => setTimeout(r, ms));

function download(blob, name) { const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500); }

const loginToEmail = l => { l = String(l || "").trim().toLowerCase(); return l.includes("@") ? l : `${noAccent(l).replace(/[^a-z0-9._-]/g, "")}@${LOGIN_DOMAIN}`; };

function retireDate(s) {

  const male = s.coBan?.gioiTinh !== "Nữ";
  for (let Y = 2021; Y <= 2040; Y++) {

    const d = addMonths(b, m);
    if (d.getFullYear() <= Y) return d;
  }
  return addMonths(b, male ? 744 : 720);
}

  const x = norm(t);
  if (!x) return "";
  if (/tien si|\bts\b/.test(x)) return "Tiến sĩ";
  if (/ckii|ck ii|chuyen khoa (ii|2|cap ii)/.test(x)) return "Chuyên khoa II";
  if (/thac si|\bths\b/.test(x)) return "Thạc sĩ";
  if (/cki|ck i|chuyen khoa (i|1|cap i)/.test(x)) return "Chuyên khoa I";
  if (/dai hoc|cu nhan|ky su|bac si/.test(x)) return "Đại học";
  if (/cao dang/.test(x)) return "Cao đẳng";
  if (/trung cap|trung hoc/.test(x)) return "Trung cấp";
  if (/so cap/.test(x)) return "Sơ cấp";
  return "Khác";
}

async function makeFirebase() {

  const app = A.initializeApp(FIREBASE_CONFIG, "qlnl"); // tên riêng: phiên đăng nhập không lẫn với app Kê đơn thuốc dùng chung project
  const auth = U.getAuth(app), db = F.getFirestore(app);
  const sec = A.initializeApp(FIREBASE_CONFIG, "qlnl-secondary"), secAuth = U.getAuth(sec);
  U.setPersistence(secAuth, U.inMemoryPersistence).catch(() => {});
  const P = c => COLLECTION_PREFIX + c;
  const ref = (c, id) => F.doc(db, P(c), id);
  return {
    mode: "firebase",
    onAuth: cb => U.onAuthStateChanged(auth, u => cb(u ? { uid: u.uid, email: u.email } : null)),
    signIn: (e, p) => U.signInWithEmailAndPassword(auth, e, p),
    signOut: () => U.signOut(auth),
    signUpSelf: (e, p) => U.createUserWithEmailAndPassword(auth, e, p).then(c => ({ uid: c.user.uid, email: c.user.email })),
    async createAccount(e, p) { const c = await U.createUserWithEmailAndPassword(secAuth, e, p); const uid = c.user.uid; await U.signOut(secAuth); return uid; },
    async changePassword(oldP, newP) { const u = auth.currentUser; await U.reauthenticateWithCredential(u, U.EmailAuthProvider.credential(u.email, oldP)); await U.updatePassword(u, newP); },
    resetEmail: e => U.sendPasswordResetEmail(auth, e),
    idToken: () => auth.currentUser.getIdToken(),
    async get(c, id) { const s = await F.getDoc(ref(c, id)); return s.exists() ? { id: s.id, ...s.data() } : null; },
    async list(c, where = [], o = {}) {
      const q = where.map(w => F.where(...w)); if (o.orderBy) q.push(F.orderBy(o.orderBy, o.dir || "asc")); if (o.limit) q.push(F.limit(o.limit));
      const s = await F.getDocs(F.query(F.collection(db, P(c)), ...q)); return s.docs.map(d => ({ id: d.id, ...d.data() }));
    },
    set: (c, id, d, merge) => F.setDoc(ref(c, id), d, { merge: !!merge }),
    update: (c, id, d) => F.updateDoc(ref(c, id), d),
    add: (c, d) => F.addDoc(F.collection(db, P(c)), d).then(r => r.id),
    del: (c, id) => F.deleteDoc(ref(c, id)),
    newId: c => F.doc(F.collection(db, P(c))).id,
    async batch(ops) {
      for (let i = 0; i < ops.length; i += 400) {

const perm = p => !!S.me?.perms?.[p];
const canList = () => isAdmin() || isTK() || (isNV() && perm("viewDept"));
const canManage = k => isAdmin() || ((isTK() || (isNV() && perm("editDept"))) && k === S.me.khoaId);

async function log(action, target = {}) {
  try { await B.add("logs", { at: nowISO(), uid: S.user.uid, ten: S.me.hoTen, action, doiTuong: target.name || "", staffId: target.id || "", khoaId: target.khoaId || S.me.khoaId || "" }); } catch (e) { console.warn("log", e); }
}

async function loadAll() {
  const k = S.me.khoaId;
  S.depts = (await B.list("departments")).sort((a, b) => (a.thuTu || 999) - (b.thuTu || 999) || a.ten.localeCompare(b.ten, "vi"));
  const st = await B.get("settings", "app").catch(() => null);
  S.settings = { ...DEFAULT_SETTINGS, ...(st || {}) };
  if (isAdmin()) S.staff = await B.list("staff");
  else if (canList()) S.staff = await B.list("staff", [["khoaId", "==", k]]);
  else S.staff = [];
  if (S.me.staffId && !S.staff.find(x => x.id === S.me.staffId)) { const m = await B.get("staff", S.me.staffId).catch(() => null); if (m) S.staff.push(m); }
  if (isAdmin()) S.users = await B.list("users");
  else if (isTK() || isMgrNV()) S.users = await B.list("users", [["khoaId", "==", k]]);
  else S.users = [];
}

async function start() {
  try { B = FIREBASE_CONFIG.apiKey ? await makeFirebase() : makeDemo(); }
  catch (e) { $("#app").innerHTML = `<div class="boot">Không tải được Firebase: ${esc(errMsg(e))}</div>`; return; }
  if (B.mode === "firebase") { try { S.needBoot = !(await B.get("settings", "bootstrap")); } catch (e) { S.needBoot = false; } }
  B.onAuth(handleAuth);
}
async function handleAuth(u) {
  if (S.booting) return;
  S.user = u; S.me = null;
  if (!u) { renderLogin(); return; }
  $("#app").innerHTML = `<div class="boot">Đang tải dữ liệu…</div>`;
  try {
    const me = await B.get("users", u.uid);
    if (!me) { toast("Tài khoản chưa được cấp quyền sử dụng ứng dụng", 1); await B.signOut(); return; }
    if (!me.active) { toast("Tài khoản đã bị khóa. Liên hệ phòng Tổ chức – Hành chính.", 1); await B.signOut(); return; }
    S.me = { ...me, uid: u.uid };
    await loadAll();
    S.view = canList() ? "dash" : "mine";
    if (S.view === "mine" && S.me.staffId) await openProfile(S.me.staffId, true); else if (S.view === "mine" && canMakeMine()) App.createMine(); else { S.draft = null; S.cur = null; render(); }
    if (me.mustChangePw) openChangePw(true);
    B.update("users", u.uid, { lastLogin: nowISO() }).catch(() => {});
  } catch (e) { console.error(e); $("#app").innerHTML = `<div class="boot">Lỗi tải dữ liệu: ${esc(errMsg(e))}<br><br><button class="btn" onclick="App.logout()">Đăng xuất</button></div>`; }
}

async function compressImage(src, w = 240, h = 320) {
  const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  const r = Math.max(w / img.width, h / img.height), dw = img.width * r, dh = img.height * r;
  const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, w, h); g.drawImage(img, (w - dw) / 2, (h - dh) / 2, dw, dh);
  return c.toDataURL("image/jpeg", 0.82);
}
const readAs = (file, how) => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r[how](file); });

function genLogin(name, taken) {
  const w = noAccent(name).toLowerCase().replace(/[^a-z\s]/g, "").trim().split(/\s+/).filter(Boolean);
  if (!w.length) return "nv" + Math.floor(Math.random() * 9999);
  let base = w.at(-1) + w.slice(0, -1).map(x => x[0]).join(""), l = base, i = 2;
  while (taken.has(l)) l = base + i++;
  taken.add(l); return l;
}

const DEMO_FILES = new Map();
const filesOn = () => B.mode === "demo" || !!DRIVE_UPLOAD_URL;
const clipIc = `<svg viewBox="0 0 24 24"><path d="M21 11.5 12.6 20a5 5 0 0 1-7.1-7.1l8.5-8.5a3.3 3.3 0 0 1 4.7 4.7l-8.5 8.5a1.7 1.7 0 0 1-2.4-2.4l7.8-7.8"/></svg>`;
function filesHTML(path, row, list, editable) {
  list = list || [];
  const chips = list.map((f, j) => `<span class="fchip ${editable ? "" : "ro"}" title="${esc(f.name)}${f.size ? " · " + (f.size / 1048576).toFixed(1) + " MB" : ""}"><a onclick="App.viewFile('${path}',${row},${j})" onmouseenter="App.preFile('${path}',${row},${j})" ontouchstart="App.preFile('${path}',${row},${j})">${esc(f.name)}</a>${editable ? `<button class="x" title="Gỡ file" onclick="App.rmFile('${path}',${row},${j})">×</button>` : ""}</span>`).join("");
  const up = editable && filesOn() ? `<button class="btn up" onclick="App.upFile('${path}',${row})" title="Tải ảnh hoặc PDF lên Google Drive">${clipIc}Tải lên</button>` : "";
  if (!chips && !up) return editable ? `<span class="muted" style="font-size:12px">Chưa cấu hình Drive</span>` : "";
  return `<div class="files">${chips}${up}</div>`;
}
function fileList(path, row, create) {
  if (row >= 0) { const r = getP(S.draft, path)?.[row]; if (!r) return []; if (!r.tep && create) r.tep = []; return r.tep || []; }
  let l = getP(S.draft, path); if (!Array.isArray(l)) { l = []; if (create) setP(S.draft, path, l); } return l;
}
async function driveCall(body) {
  const r = await fetch(DRIVE_UPLOAD_URL, { method: "POST", body: JSON.stringify({ ...body, idToken: await B.idToken() }) });
  let j; try { j = await r.json(); } catch (e) { throw new Error("Máy chủ Drive trả về dữ liệu không hợp lệ (kiểm tra lại DRIVE_UPLOAD_URL)"); }
  if (!j.ok) throw new Error(j.error || "Lỗi Drive"); return j;
}
const b64ToBlob = (b64, mime) => new Blob([Uint8Array.from(atob(b64), c => c.charCodeAt(0))], { type: mime });
async function prepFile(f) {
  if (/^image\/(jpeg|png|webp|bmp)$/.test(f.type) && f.size > 600 * 1024) {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(f); });
    const k = Math.min(1, 2000 / Math.max(img.width, img.height)); const c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
    const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
    const blob = await new Promise(r => c.toBlob(r, "image/jpeg", 0.85));
    return { name: f.name.replace(/\.\w+$/, "") + ".jpg", mime: "image/jpeg", blob };
  }
  return { name: f.name, mime: f.type || "application/octet-stream", blob: f };
}
async function uploadOne(f, path) {
  const p = await prepFile(f);
  if (p.blob.size > MAX_FILE_MB * 1048576) throw new Error(`${f.name}: quá ${MAX_FILE_MB} MB`);
  const data = (await readAs(p.blob, "readAsDataURL")).split(",")[1];
  const meta = { name: p.name, mime: p.mime, size: p.blob.size, at: nowISO(), by: S.me.hoTen };
  if (B.mode === "demo") { const id = "demo_" + Math.random().toString(36).slice(2); DEMO_FILES.set(id, { data, mime: p.mime }); return { id, ...meta }; }
  const sec = SECTIONS.find(x => x.key === path.split(".")[0]);
  const j = await driveCall({ action: "upload", staffId: S.cur, staffName: S.draft.coBan?.hoTen || "", section: sec ? `${sec.no}. ${sec.title}` : path, name: p.name, mime: p.mime, data });
  cacheBlob(j.file.id, p.blob);
  return { id: j.file.id, ...meta };
}
// Bộ nhớ đệm file đã mở trong phiên: mở lại tức thì; rê chuột lên tên file là bắt đầu tải trước
const FILE_CACHE = new Map();
function cacheBlob(id, blob) { FILE_CACHE.set(id, Promise.resolve(blob)); while (FILE_CACHE.size > 40) FILE_CACHE.delete(FILE_CACHE.keys().next().value); }
function getFileBlob(staffId, f) {
  if (FILE_CACHE.has(f.id)) return FILE_CACHE.get(f.id);
  const pr = (async () => {
    if (B.mode === "demo") { const d = DEMO_FILES.get(f.id); if (!d) throw new Error("File demo chỉ còn trong phiên hiện tại"); return b64ToBlob(d.data, d.mime); }
    const r = await driveCall({ action: "get", staffId, fileId: f.id }); return b64ToBlob(r.data, r.mime || f.mime);
  })();
  FILE_CACHE.set(f.id, pr); pr.catch(() => FILE_CACHE.delete(f.id));
  while (FILE_CACHE.size > 40) FILE_CACHE.delete(FILE_CACHE.keys().next().value);
  return pr;
}
function filesDiscard() { const ids = S.fUp.splice(0); S.fTrash = []; ids.forEach(id => driveTrash(S.cur, id)); }
function filesCommit(staffId) { const ids = S.fTrash.splice(0); S.fUp = []; ids.forEach(id => driveTrash(staffId, id)); }
function driveTrash(staffId, id) {
  if (B.mode === "demo") { DEMO_FILES.delete(id); return; }
  if (!DRIVE_UPLOAD_URL || !staffId) return;
  driveCall({ action: "trash", staffId, fileId: id }).catch(e => console.warn("trash", e));
}

      <label class="f wide">Liên kết hồ sơ nhân sự<select id="af_staff" onchange="App.accSet('staffId',this.value)"><option value="">— không liên kết —</option>${staffOpts.map(s => `<option value="${s.id}" ${s.id === a.staffId ? "selected" : ""}>${esc(nameOf(s))} · ${fmtDate(s.coBan?.ngaySinh)}</option>`).join("")}</select></label>
      <label class="f">Họ và tên hiển thị<input type="text" id="af_name" value="${esc(a.hoTen)}"></label>
      <label class="f">Tên đăng nhập hoặc email<input type="text" id="af_login" value="${esc(a.login)}" ${isNew ? "" : "disabled"}></label>
      ${isNew ? `<label class="f">Mật khẩu ban đầu<input type="text" id="af_pw" value="${esc(a.pw)}"></label>` : ""}
    </div>
    ${a.role === "nhanvien" && a.chucDanh ? `<div class="note" style="margin-top:12px"><b>${esc(a.chucDanh)}</b>: quản lý cùng trưởng khoa — xem, thêm, sửa hồ sơ trong khoa; tạo, khóa, phân quyền tài khoản nhân viên khoa. Không sửa được tài khoản trưởng khoa. Có thể bỏ bớt quyền ở dưới.</div>` : ""}
    ${a.role === "nhanvien" ? `<div class="subt"><b>Quyền chi tiết</b></div><div class="grid" style="gap:6px">${PERMS.filter(([k]) => k !== "manageAcc" || isAdmin() || isTK()).map(([k, l]) => `<label class="chk"><input type="checkbox" data-perm="${k}" ${a.perms?.[k] ? "checked" : ""}> ${l}</label>`).join("")}</div>` : `<div class="note" style="margin-top:12px">${a.role === "admin" ? "Quản trị: xem, sửa, nhập, xuất toàn bộ hồ sơ; quản lý khoa/phòng, tài khoản." : "Trưởng / phó khoa, phòng: toàn quyền trong khoa như nhau — xem, thêm, sửa hồ sơ; nhập 2C; tạo và phân quyền tài khoản nhân viên khoa."}</div>`}
    <div class="foot"><button class="btn" onclick="App.close()">Hủy</button><button class="btn pri" id="af_ok" onclick="App.accSave()">${isNew ? "Tạo tài khoản" : "Lưu"}</button></div>`);
  },
  accRead() {
    const a = S.af; a.hoTen = $("#af_name").value.trim(); if ($("#af_login")) a.login = $("#af_login").value.trim(); if ($("#af_pw")) a.pw = $("#af_pw").value;
    if ($$("[data-perm]").length) { a.perms = { ...(a.perms || {}) }; $$("[data-perm]").forEach(c => a.perms[c.dataset.perm] = c.checked); }
    if (a.perms?.manageAcc) { a.perms.viewDept = true; a.perms.editDept = true; }   // quản lý tài khoản cần quyền xem/sửa hồ sơ khoa để liên kết
    if (isMgrNV()) a.perms.manageAcc = false;
  },
  accSet(k, v) {
    App.accRead(); const a = S.af; a[k] = v;
    if (k === "khoaId" && !a._id) a.staffId = "";
    if (k === "roleKey") { const o = ROLE_OPTS.find(x => x[0] === v); a.role = o[2]; a.chucDanh = o[3]; a.perms = o[3] ? { ...MGR_PERMS } : { editSelf: true }; }
    if (k === "staffId" && v) { const s = S.staff.find(x => x.id === v); if (!a.hoTen) a.hoTen = nameOf(s); if (!a._id && !a.login) a.login = genLogin(nameOf(s), new Set(S.users.map(u => (u.login || "").toLowerCase()))); }
    App.accRender();
  },
  async accSave() {
    App.accRead(); const a = S.af;
    if (!a.hoTen || !a.khoaId || (!a._id && !a.login)) return toast("Nhập đủ họ tên, khoa/phòng, tên đăng nhập", 1);
    if (!a._id && String(a.pw).length < 6) return toast("Mật khẩu tối thiểu 6 ký tự", 1);
    const perms = a.role === "nhanvien" ? (a.perms || {}) : {};
    $("#af_ok").disabled = true;
    try {
      if (!a._id) {
        const email = loginToEmail(a.login);
        const uid = await B.createAccount(email, a.pw);
        const u = { hoTen: a.hoTen, login: a.login, email, role: a.role, chucDanh: a.chucDanh || "", khoaId: a.khoaId, staffId: a.staffId || "", perms, active: true, mustChangePw: true, createdAt: nowISO(), createdBy: S.me.hoTen };
        const ops = [{ op: "set", col: "users", id: uid, data: u }]; if (a.staffId) ops.push({ op: "update", col: "staff", id: a.staffId, data: { uid } });
        await B.batch(ops);
        S.users.push({ id: uid, ...u }); if (a.staffId) S.staff.find(s => s.id === a.staffId).uid = uid;
        log("Tạo tài khoản", { name: `${a.hoTen} (${a.login}) – ${roleLabel(a)}`, khoaId: a.khoaId });
        closeModal(); render();
        modal(`<h3>Đã tạo tài khoản</h3><p>Gửi thông tin đăng nhập cho <b>${esc(a.hoTen)}</b>:</p><div class="card" style="font-family:monospace;font-size:15px">Tên đăng nhập: ${esc(a.login)}<br>Mật khẩu: ${esc(a.pw)}</div><p class="muted">Người dùng sẽ phải đổi mật khẩu ở lần đăng nhập đầu tiên.</p><div class="foot"><button class="btn pri" onclick="App.close()">Xong</button></div>`);
      } else {
        const old = S.users.find(u => u.id === a._id), oldStaffId = old.staffId || "";
        const data = { hoTen: a.hoTen, role: a.role, chucDanh: a.chucDanh || "", khoaId: a.khoaId, staffId: a.staffId || "", perms };
        const ops = [{ op: "update", col: "users", id: a._id, data }];
        const os = oldStaffId && oldStaffId !== a.staffId ? S.staff.find(s => s.id === oldStaffId) : null;
        if (os) ops.push({ op: "update", col: "staff", id: oldStaffId, data: { uid: "" } });
        const st = a.staffId ? S.staff.find(s => s.id === a.staffId) : null;
        let moved = null;
        const khoaChanged = st && isAdmin() && st.khoaId && st.khoaId !== a.khoaId;
        const roleChanged = roleKeyOf(old) !== a.roleKey;
        const title = a.chucDanh || (a.role === "truongkhoa" ? "Trưởng khoa / phòng" : "");
        if (st && (khoaChanged || (roleChanged && title))) {
          moved = { "congTac.quaTrinh": khoaMoveHistory(st, a.khoaId, roleChanged && title ? title : "") };
          if (khoaChanged) moved.khoaId = a.khoaId;
          if (roleChanged && title) moved["luong.chucVu"] = title;
        }
        if (a.staffId && (a.staffId !== oldStaffId || moved)) ops.push({ op: "update", col: "staff", id: a.staffId, data: { uid: a._id, ...(moved || {}) } });
        await B.batch(ops);
        Object.assign(old, data);
        if (os) os.uid = "";
        if (st) { st.uid = a._id; if (moved) {
          log(khoaChanged ? "Chuyển khoa" : "Bổ nhiệm / đổi chức danh", { id: st.id, name: `${st.coBan?.hoTen}: ${khoaChanged ? deptName(st.khoaId) + " → " + deptName(a.khoaId) : ""}${roleChanged && title ? " (" + title + ")" : ""}`, khoaId: a.khoaId });
          st.khoaId = a.khoaId; st.congTac = st.congTac || {}; st.congTac.quaTrinh = moved["congTac.quaTrinh"];
          if (moved["luong.chucVu"]) { st.luong = st.luong || {}; st.luong.chucVu = moved["luong.chucVu"]; } } }
        log("Sửa tài khoản / phân quyền", { name: a.hoTen, khoaId: a.khoaId });
        closeModal(); render(); toast(moved ? `Đã lưu${khoaChanged ? " — hồ sơ chuyển sang " + deptName(a.khoaId) : ""}${roleChanged && title ? " — chức vụ: " + title : ""}, đã ghi quá trình công tác` : "Đã lưu");
      }
    } catch (e) { toast(errMsg(e), 1); const b = $("#af_ok"); if (b) b.disabled = false; }
  },
  resetPw(uid) {
    const u = S.users.find(x => x.id === uid); if (!u) return;
    modal(`<h3>Đặt lại mật khẩu</h3><p>Tạo mật khẩu tạm mới cho <b>${esc(u.hoTen)}</b> (tên đăng nhập <b>${esc(u.login || u.email)}</b>). Mật khẩu cũ sẽ không dùng được nữa; người dùng phải đổi mật khẩu ngay khi đăng nhập.</p>
      <div class="foot"><button class="btn" onclick="App.close()">Hủy</button><button class="btn pri" id="rp_ok" onclick="App.doResetPw('${uid}')">Đặt lại mật khẩu</button></div>`);
  },
  async doResetPw(uid) {
    const u = S.users.find(x => x.id === uid); $("#rp_ok").disabled = true; $("#rp_ok").textContent = "Đang xử lý…";
    try {
      let pw;
      if (B.mode === "demo") { pw = randPw(); await B.adminSetPw(u.email, pw); }
      else pw = (await driveCall({ action: "resetPw", targetUid: uid })).password;
      await B.update("users", uid, { mustChangePw: true }).catch(() => {}); u.mustChangePw = true;
      log("Đặt lại mật khẩu", { name: `${u.hoTen} (${u.login || u.email})`, khoaId: u.khoaId });
      render();
      const txt = `Tên đăng nhập: ${u.login || u.email}\nMật khẩu tạm: ${pw}`;
      modal(`<h3>Đã đặt lại mật khẩu</h3><p>Gửi thông tin này cho <b>${esc(u.hoTen)}</b>:</p>
        <div class="card" style="font-family:monospace;font-size:16px">Tên đăng nhập: <b>${esc(u.login || u.email)}</b><br>Mật khẩu tạm: <b>${esc(pw)}</b></div>
        <p class="muted">Mật khẩu chỉ hiện một lần này. Người dùng sẽ phải đổi mật khẩu khi đăng nhập.</p>
        <div class="foot"><button class="btn" id="rp_copy">Sao chép</button><button class="btn pri" onclick="App.close()">Xong</button></div>`);
      $("#rp_copy").onclick = () => navigator.clipboard.writeText(txt).then(() => toast("Đã sao chép"), () => toast("Không sao chép được, hãy chép tay", 1));
    } catch (e) { toast(errMsg(e), 1); closeModal(); }
  },
  async toggleAcc(uid) {
    const u = S.users.find(x => x.id === uid); if (!confirm(`${u.active ? "Khóa" : "Mở khóa"} tài khoản ${u.hoTen}?`)) return;
    try { await B.update("users", uid, { active: !u.active }); u.active = !u.active; log(u.active ? "Mở khóa tài khoản" : "Khóa tài khoản", { name: u.hoTen, khoaId: u.khoaId }); render(); } catch (e) { toast(errMsg(e), 1); }
  },
  bulkAcc() {
    const khoa = isAdmin() ? (S.bulkKhoa || S.depts[0]?.id || "") : S.me.khoaId; S.bulkKhoa = khoa;
    const taken = new Set(S.users.map(u => (u.login || "").toLowerCase()));
    const list = S.staff.filter(s => s.khoaId === khoa && !s.uid && working(s)).map(s => ({ s, login: genLogin(nameOf(s), taken), pw: randPw(), on: true }));
    S.bulk = list;
    modal(`<h3>Tạo tài khoản hàng loạt</h3>
      ${isAdmin() ? `<label class="f" style="max-width:320px">Khoa / phòng<select onchange="S_bulk(this.value)">${deptOptions(khoa)}</select></label>` : ""}
      <p class="muted">Tạo tài khoản vai trò <b>Nhân viên</b> (quyền: tự cập nhật hồ sơ của mình) cho ${list.length} người chưa có tài khoản. Mỗi người có mật khẩu ngẫu nhiên, phải đổi ở lần đăng nhập đầu.</p>
      <div class="tbl-wrap" style="max-height:340px"><table class="t"><thead><tr><th></th><th>Họ và tên</th><th>Tên đăng nhập</th><th>Mật khẩu</th></tr></thead><tbody>
      ${list.map((x, i) => `<tr><td><input type="checkbox" checked onchange="S.bulk[${i}].on=this.checked"></td><td>${esc(nameOf(x.s))}</td><td><input type="text" value="${esc(x.login)}" onchange="S.bulk[${i}].login=this.value.trim()" style="width:140px"></td><td style="font-family:monospace">${x.pw}</td></tr>`).join("") || `<tr><td colspan="4" class="empty">Mọi nhân viên đã có tài khoản</td></tr>`}
      </tbody></table></div><div class="prog" id="bk_prog" style="display:none"><div></div></div>
      <div class="foot"><button class="btn" onclick="App.close()">Đóng</button><button class="btn pri" id="bk_ok" onclick="App.bulkRun()" ${list.length ? "" : "disabled"}>Tạo tài khoản</button></div>`, 1);
  },
  async bulkRun() {
    const L = S.bulk.filter(x => x.on); $("#bk_ok").disabled = true; $("#bk_prog").style.display = "block";
    const done = [];
    for (let i = 0; i < L.length; i++) {
      const x = L[i];
      try {
        let login = x.login, uid, n = 2;
        for (;;) { try { uid = await B.createAccount(loginToEmail(login), x.pw); break; } catch (e) { if (e.code === "auth/email-already-in-use" && n < 10) login = x.login + n++; else throw e; } }
        const u = { hoTen: nameOf(x.s), login, email: loginToEmail(login), role: "nhanvien", khoaId: x.s.khoaId, staffId: x.s.id, perms: { editSelf: true }, active: true, mustChangePw: true, createdAt: nowISO(), createdBy: S.me.hoTen };
        await B.batch([{ op: "set", col: "users", id: uid, data: u }, { op: "update", col: "staff", id: x.s.id, data: { uid } }]);
        S.users.push({ id: uid, ...u }); x.s.uid = uid; done.push([u.hoTen, deptName(u.khoaId), login, x.pw]);
      } catch (e) { done.push([nameOf(x.s), deptName(x.s.khoaId), "LỖI: " + errMsg(e), ""]); }
      $("#bk_prog").firstElementChild.style.width = ((i + 1) / L.length * 100) + "%";
      if (B.mode === "firebase") await sleep(400);
    }
    log("Tạo tài khoản hàng loạt", { name: `${done.length} tài khoản`, khoaId: S.bulkKhoa });
    S.bulkDone = done; render();
    modal(`<h3>Đã tạo ${done.filter(d => d[3]).length} tài khoản</h3><p class="muted">Tải danh sách để in/gửi cho nhân viên. Mật khẩu chỉ hiển thị một lần.</p>
      <div class="tbl-wrap" style="max-height:340px"><table class="t"><thead><tr><th>Họ và tên</th><th>Khoa</th><th>Tên đăng nhập</th><th>Mật khẩu</th></tr></thead><tbody>${done.map(r => `<tr>${r.map(c => `<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>
      <div class="foot"><button class="btn" onclick="App.bulkXlsx()">Tải Excel</button><button class="btn pri" onclick="App.close()">Xong</button></div>`, 1);
  },
  bulkXlsx() { if (!window.XLSX) return; const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([["Họ và tên", "Khoa/phòng", "Tên đăng nhập", "Mật khẩu"], ...S.bulkDone]), "Tài khoản"); XLSX.writeFile(wb, `TaiKhoan_${isoOf(new Date())}.xlsx`); },
  // ----- khoa phòng
  deptForm(id) {
    const d = id ? S.depts.find(x => x.id === id) : { ten: "", ma: "", thuTu: S.depts.length + 1 };
    modal(`<h3>${id ? "Sửa" : "Thêm"} khoa / phòng</h3><div class="form"><label class="f wide">Tên<input type="text" id="dp_t" value="${esc(d.ten)}"></label><label class="f">Mã<input type="text" id="dp_m" value="${esc(d.ma || "")}"></label><label class="f">Thứ tự<input type="number" id="dp_o" value="${d.thuTu || ""}"></label></div>
      <div class="foot"><button class="btn" onclick="App.close()">Hủy</button><button class="btn pri" onclick="App.deptSave('${id || ""}')">Lưu</button></div>`);
  },
  async deptSave(id) {
    const data = { ten: $("#dp_t").value.trim(), ma: $("#dp_m").value.trim(), thuTu: +$("#dp_o").value || 0 }; if (!data.ten) return toast("Nhập tên", 1);
    try { const nid = id || B.newId("departments"); await B.set("departments", nid, data, true); const i = S.depts.findIndex(x => x.id === nid); if (i >= 0) S.depts[i] = { id: nid, ...data }; else S.depts.push({ id: nid, ...data }); S.depts.sort((a, b) => (a.thuTu || 999) - (b.thuTu || 999)); closeModal(); render(); } catch (e) { toast(errMsg(e), 1); }
  },
  async delDept(id) {
    if (S.staff.some(s => s.khoaId === id) || S.users.some(u => u.khoaId === id)) return toast("Khoa còn hồ sơ hoặc tài khoản — chuyển đi trước khi xóa", 1);
    if (!confirm("Xóa khoa/phòng này?")) return;
    try { await B.del("departments", id); S.depts = S.depts.filter(d => d.id !== id); render(); } catch (e) { toast(errMsg(e), 1); }
  },
  async seedDepts() {
    const ops = DEFAULT_DEPTS.map((t, i) => ({ op: "set", col: "departments", id: B.newId("departments"), data: { ten: t, ma: "", thuTu: i + 1 } }));
    try { await B.batch(ops); S.depts = ops.map(o => ({ id: o.id, ...o.data })); render(); } catch (e) { toast(errMsg(e), 1); }
  },
  async saveSettings() {
    const d = { tenBV: $("#se_bv").value.trim(), coQuanQL: $("#se_ql").value.trim() };
    try { await B.set("settings", "app", d, true); Object.assign(S.settings, d); toast("Đã lưu"); render(); } catch (e) { toast(errMsg(e), 1); }
  },
  reloadLogs() { S.logs = null; render(); },
  changePw() { openChangePw(false); },
  async doChangePw(force) {
    const o = $("#pw_o").value, n = $("#pw_n").value, c = $("#pw_c").value;
    if (n !== c) return toast("Mật khẩu nhập lại không khớp", 1);
    if (n.length < 6) return toast("Mật khẩu tối thiểu 6 ký tự", 1);
    if (n === o) return toast("Mật khẩu mới phải khác mật khẩu cũ", 1);
    try { await B.changePassword(o, n); if (S.me.mustChangePw) { await B.update("users", S.user.uid, { mustChangePw: false }); S.me.mustChangePw = false; } closeModal(); toast("Đã đổi mật khẩu"); } catch (e) { toast(errMsg(e), 1); }
  },
  close: closeModal
};
window.S_bulk = v => { S.bulkKhoa = v; App.bulkAcc(); };
window.App = App; window.S = S;
start();
</script>
</body>
</html>
